# =============================================================================
# Render Blueprint — School Manager (pnpm/turborepo monorepo)
# =============================================================================
# Deploys two services from this single repo:
#   1. school-manager-api  — NestJS backend (apps/api)
#   2. school-manager-web  — Next.js frontend (apps/web)
#
# Usage: Render Dashboard → New → Blueprint → point at this repo. Render reads
# this file and creates/updates both services together.
#
# Env vars marked "sync: false" must be filled in manually in the Render
# dashboard after the blueprint is created — they are secrets and are not
# stored in git.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # API (NestJS)
  # ---------------------------------------------------------------------------
  - type: web
    name: school-manager-api
    env: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: >-
      corepack enable &&
      corepack prepare pnpm@9.0.0 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm turbo run build --filter=@school-manager/api...
    # Runs after a successful build, before the new instance takes traffic.
    # Applies pending Prisma migrations against the database.
    preDeployCommand: pnpm --filter @school-manager/db migrate:deploy
    startCommand: pnpm --filter @school-manager/api start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        value: https://school-manager-web.onrender.com
      - key: SENTRY_DSN
        sync: false
      # Uncomment/add as these features come online (see .env.example):
      # - key: UPSTASH_REDIS_REST_URL
      #   sync: false
      # - key: UPSTASH_REDIS_REST_TOKEN
      #   sync: false
      # - key: R2_ACCOUNT_ID
      #   sync: false
      # - key: RESEND_API_KEY
      #   sync: false
      # - key: PAYSTACK_SECRET_KEY
      #   sync: false

  # ---------------------------------------------------------------------------
  # WEB (Next.js)
  # ---------------------------------------------------------------------------
  - type: web
    name: school-manager-web
    env: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: >-
      corepack enable &&
      corepack prepare pnpm@9.0.0 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm turbo run build --filter=@school-manager/web...
    startCommand: pnpm --filter @school-manager/web start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      # Required at BUILD time (baked into the client bundle) — must be set
      # here, not only on the API service.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        value: https://school-manager-web.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://school-manager-api.onrender.com
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: POSTHOG_API_KEY
        sync: false
