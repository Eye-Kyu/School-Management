# =============================================================================
# CI - runs on every push to main and every pull request
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs when a PR is updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @school-manager/db generate

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: |
          pnpm --filter @school-manager/api exec tsc --noEmit
          pnpm --filter @school-manager/web exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: RLS check
        run: bash infra/scripts/check-rls.sh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Runs on every CI build, not just PRs touching supabase/migrations/ —
      # matches the RLS check's own always-on precedent above rather than
      # adding a new path-filtering action dependency for a check this cheap.
      - name: Migration parity check
        run: bash infra/scripts/check-migrations.sh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Cross-tenant isolation e2e test
        run: pnpm --filter @school-manager/api test:e2e
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Build
        run: pnpm build
        env:
          # Auth pages call createBrowserClient() during SSR prerender; placeholder
          # values satisfy the non-empty check without making real network calls.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-ci-build-only
